<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="PORTFOLIO DE PROJETS VIDÉOS">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="skip"></a>

<!-- ============ 1. EN-TÊTE : menu (gauche) + choix de langue (droite) ============ -->
<header class="site-header">
  <nav data-i18n-aria="nav_label">
    <ul class="nav-list">
      <li><a href="#accueil" data-i18n="nav_home"></a></li>
      <li><a href="#projets" data-i18n="nav_projects"></a></li>
      <li><a href="#apropos" data-i18n="nav_about"></a></li>
      <li><a href="#contact" data-i18n="nav_contact"></a></li>
    </ul>
  </nav>
  <div class="lang-switch" role="group" data-i18n-aria="lang_label">
    <button type="button" data-lang="fr" aria-label="Français" title="Français">
      <svg viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>
    </button>
    <button type="button" data-lang="en" aria-label="English" title="English">
      <svg viewBox="0 0 60 30" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg>
    </button>
  </div>
</header>

<main id="main">

<!-- ============ 2. ACCUEIL (image de fond : variable --hero-image dans style.css) ============ -->
<section id="accueil" class="hero" aria-labelledby="hero-title">
  <div class="hero-inner">
    <h1 id="hero-title" data-site="name"></h1>
    <p class="hero-sub" data-i18n="hero_sub"></p>
    <a class="btn btn-primary" href="#projets" data-i18n="hero_cta"></a>
  </div>
</section>

<!-- ============ 3. PROJETS (contenu généré depuis data/projects.js) ============ -->
<section id="projets" class="section" aria-labelledby="projets-title">
  <div class="container">
    <h2 id="projets-title" data-i18n="proj_title"></h2>
    <p class="section-sub" data-i18n="proj_sub"></p>

    <!-- Filtres (gauche) + tri (droite) -->
    <div class="toolbar">
      <div class="filters" role="group" data-i18n-aria="filter_label" id="filters"></div>
      <div class="sort">
        <label for="sort" data-i18n="sort_label"></label>
        <select id="sort">
          <option value="date" data-i18n="sort_date"></option>
          <option value="relevance" data-i18n="sort_relevance" selected></option>
          <option value="alpha" data-i18n="sort_alpha"></option>
        </select>
      </div>
    </div>

    <!-- Catalogue : flèche gauche / 3 projets / flèche droite -->
    <div class="carousel" id="carousel" role="region" tabindex="0" data-i18n-aria="carousel_label">
      <button type="button" class="arrow" id="prev" data-i18n-aria="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" /></svg></button>
      <div class="viewport"><div class="track" id="track"></div></div>
      <button type="button" class="arrow" id="next" data-i18n-aria="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" /></svg></button>
    </div>
    <p class="empty" id="empty" hidden data-i18n="no_result"></p>
    <div class="dots" id="dots"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </div>
</section>

<!-- ============ 4. À PROPOS ============ -->
<section id="apropos" class="section section-alt" aria-labelledby="about-title">
  <div class="container">

    <!-- 4a. Présentation : photo (gauche) + texte (droite) -->
    <div class="about">
      <img id="portrait" class="portrait" src="assets/profilpic.jpeg" width="600" height="600" alt="" data-i18n-alt="portrait_alt">
      <div>
        <h2 id="about-title" data-i18n="about_title"></h2>
        <p class="about-text" data-i18n="about_text"></p>
        <ul class="icons">
          <li><a id="link-mail" href="#" data-i18n-aria="mail"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 6.5l8.5 7 8.5-7" fill="none" stroke="currentColor" stroke-width="2"/></svg></a></li>
          <li><a id="link-linkedin" href="#" target="_blank" rel="noopener noreferrer" data-i18n-aria="linkedin"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4v11H3zM9.5 9.5h3.8v1.6h.1c.5-1 1.8-1.9 3.7-1.9 4 0 4.9 2.6 4.9 6v5.3h-4v-4.7c0-1.2 0-2.7-1.7-2.7s-1.9 1.3-1.9 2.6v4.8h-4z"/></svg></a></li>
        </ul>
      </div>
    </div>

    <!-- 4b. CV en classeur : onglets + panneau (contenu dans data/site.js > CV) -->
    <div class="cv">
      <div class="cv-tabs" role="tablist" data-i18n-aria="cv_label" id="cv-tabs"></div>
      <div class="cv-panel" id="cv-panel" role="tabpanel" tabindex="0"></div>
    </div>
  </div>
</section>

</main>

<!-- ============ 5. PIED DE PAGE (id="contact") ============ -->
<footer id="contact" class="site-footer">
  <a class="btn btn-primary" id="footer-mail" href="#" data-i18n="footer_contact"></a>
  <button type="button" class="link-btn" id="open-legal" data-i18n="legal"></button>
</footer>

<!-- ============ 6. POP-UPS (fiche projet + mentions légales) ============ -->
<dialog id="project-modal" class="modal" aria-labelledby="pm-title">
  <button type="button" class="close" data-close data-i18n-aria="close">&times;</button>
  <div id="modal-body"></div>
</dialog>
<dialog id="legal-modal" class="modal modal-text" aria-labelledby="legal-title">
  <button type="button" class="close" data-close data-i18n-aria="close">&times;</button>
  <div class="modal-content" id="legal-body"></div>
</dialog>

<script src="data/projects.js"></script>
<script src="data/site.js"></script>
<script src="script.js"></script>
</body>
</html>
